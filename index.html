<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#02030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مساحتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساحتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#1b2036;--mute:#6b7190;--acc:#4b3fe0;--accSoft:#e4e1fd;--ok:#14a37f;--warn:#d9480f;--line:#dcdff0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11142a;--card:#1b2040;--ink:#eef0ff;--mute:#9aa0c8;--acc:#8b82ff;--accSoft:#2b2d63;--line:#2d3260;--warn:#ff8a5c}}
:root[data-theme="dark"]{--bg:#11142a;--card:#1b2040;--ink:#eef0ff;--mute:#9aa0c8;--acc:#8b82ff;--accSoft:#2b2d63;--line:#2d3260;--warn:#ff8a5c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 150px}
h1{font-size:28px;margin:8px 0 14px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:12px;border:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.badge{background:var(--accSoft);color:var(--acc);padding:2px 10px;border-radius:99px;font-weight:500}
.due{margin-inline-start:auto}.due.late{color:var(--warn);font-weight:700}
.txt{margin:10px 0 0;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.done .txt{text-decoration:line-through;opacity:.5}
audio{width:100%;margin-top:10px;height:40px}
.card img{width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:10px}
.acts{display:flex;gap:14px;margin-top:10px;font-size:14px}
.acts button{background:none;border:0;color:var(--mute);font:inherit;padding:4px 0}
.acts .chk{color:var(--ok);font-weight:500}
.empty{text-align:center;color:var(--mute);margin-top:60px;line-height:1.9}
.dock{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;align-items:center;background:linear-gradient(transparent,var(--bg) 40%)}
.dock button{border:0;font:inherit;color:#fff;background:var(--acc);box-shadow:0 8px 24px rgba(75,63,224,.35)}
.main{width:72px;height:72px;border-radius:50%;font-size:34px}
.side{width:54px;height:54px;border-radius:50%;font-size:22px;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.pane{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.chips{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px}
.chip[aria-pressed=true]{background:var(--accSoft);border-color:var(--acc);color:var(--acc);font-weight:700}
textarea,input[type=datetime-local]{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit}
.row .rec{background:#e03131;border-color:#e03131;color:#fff}
.save{width:100%;margin-top:14px;border:0;background:var(--acc);color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px}
.pv img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.views{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:99px;margin-bottom:14px}
.vbtn{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;padding:10px 4px;border-radius:99px;transition:background .35s cubic-bezier(.3,1.4,.5,1),color .25s,transform .25s}
.vbtn[aria-pressed=true]{background:var(--acc);color:#fff;transform:scale(1.05);box-shadow:0 6px 16px rgba(75,63,224,.35)}
.enter{animation:vin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
#list[data-anim="1"] .card,#habits[data-anim="1"] .hcard{animation:cin .55s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cin{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.sheet.on{animation:fade .3s}.sheet.on .pane{animation:up .45s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.main{position:relative;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.main:active{transform:scale(.86) rotate(90deg)}
.main::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:ringp 2.4s ease-out infinite;pointer-events:none}
@keyframes ringp{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.side{transition:transform .2s}.side:active{transform:scale(.84)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px}
.addrow button{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:0 18px;font:inherit;font-weight:700}
.htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hname{font-weight:700;font-size:17px}
.streak{font-size:14px;color:var(--mute);background:var(--bg);padding:4px 12px;border-radius:99px}
.streak.on{color:#fff;background:linear-gradient(135deg,#ff9a3d,#e8590c)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;transition:background .25s,transform .15s}
.day small{font-size:11px}.day b{height:20px;font-size:16px}
.day:active{transform:scale(.86)}.day.today{border-color:var(--acc)}
.day.on{background:var(--ok);border-color:var(--ok);color:#fff}
.day.just b{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-45deg)}to{transform:none}}
.tchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.tchips .chip{flex:none}
.tbox{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:22px auto 10px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:10}
.arc{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s cubic-bezier(.3,1.2,.5,1),stroke .3s}
.tbox.full .arc{stroke:var(--ok)}
.tap{position:absolute;inset:9%;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 14px 34px rgba(75,63,224,.25),inset 0 0 0 1px var(--line);transition:transform .15s cubic-bezier(.3,1.5,.5,1);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.tap:active{transform:scale(.92)}
.tl{font-size:16px;color:var(--mute);text-align:center;padding:0 12px}.tc{font-size:64px;font-weight:700;line-height:1.1;color:var(--acc)}.tt{font-size:14px;color:var(--mute)}
.tc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}
.rip{position:absolute;inset:0;border-radius:50%;background:var(--acc);opacity:.28;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(0)}to{transform:scale(1);opacity:0}}
.tbox.cele{animation:cele .8s}
@keyframes cele{30%{transform:scale(1.08)}60%{transform:scale(.97)}}
.tinfo{text-align:center;color:var(--mute);font-size:14px;margin-bottom:6px}
.views{overflow-x:auto}.vbtn{flex:none;padding:10px 14px}
.hd{display:flex;align-items:center;justify-content:space-between}.hd h1{margin:8px 0 14px}
.hd button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;transition:transform .4s}.hd button:active{transform:rotate(120deg) scale(.9)}
.pals{display:flex;gap:14px;margin:18px 0 8px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.sw[aria-pressed=true]{border-color:var(--ink);transform:scale(1.18)}
:root[data-pal='forest']{--acc:#1f8a5b;--accSoft:#d6f0e3;--bg:#edf5ef}:root[data-pal='forest'][data-theme='dark']{--acc:#5fd49a;--accSoft:#1f4a37;--bg:#0f1f18;--card:#172a21;--line:#24402f}
:root[data-pal='rose']{--acc:#d6336c;--accSoft:#fde0ea;--bg:#fbeff3}:root[data-pal='rose'][data-theme='dark']{--acc:#ff7aa8;--accSoft:#4d2036;--bg:#1e0f16;--card:#2b1722;--line:#472536}
:root[data-pal='ocean']{--acc:#1c7ed6;--accSoft:#dbeafc;--bg:#ecf3fa}:root[data-pal='ocean'][data-theme='dark']{--acc:#5db0ff;--accSoft:#1d3a5a;--bg:#0d1a28;--card:#152638;--line:#233a54}
:root[data-pal='sunset']{--acc:#e8590c;--accSoft:#ffe6d5;--bg:#fbf1e8}:root[data-pal='sunset'][data-theme='dark']{--acc:#ff9a5c;--accSoft:#4e2a14;--bg:#1f130b;--card:#2c1c10;--line:#4a2f1c}
.scene{border-radius:24px;overflow:hidden;border:1px solid var(--line);margin-top:8px;box-shadow:0 12px 30px rgba(0,0,0,.14);animation:vin .6s}
.scene svg{display:block;width:100%}
.cloud{animation:drift 60s linear infinite}.c2{animation-duration:85s;animation-delay:-30s}.c3{animation-duration:110s;animation-delay:-70s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(450px)}}
.star,.shim{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.glow{animation:gl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{50%{transform:scale(1.25);opacity:.4}}
#liveArt{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s linear}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{50%{transform:rotate(3deg)}}
.pop{animation:popin .9s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:50% 100%}@keyframes popin{from{transform:scale(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.inav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.inav button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px}.inav button:disabled{opacity:.3}
.inav b{color:var(--ink);text-align:center;flex:1;font-size:15px}
.clockrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.clock{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;min-width:170px;text-align:center}
.pm{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}.pm:disabled{opacity:.25}
.fsub{text-align:center;color:var(--mute);font-size:14px;margin:2px 0 10px}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fstats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mute)}
.fstats b{display:block;font-size:22px;color:var(--acc);margin-bottom:2px}
.chip:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,1.4,.4,1);z-index:9;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#shop[data-anim='1'] .sitem{animation:cin .5s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 14px}
.sbox{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;font-size:15px;flex:none;transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.sbox.on{background:var(--ok);border-color:var(--ok);transform:scale(1.12)}
.sname{flex:1;font-size:16px;transition:opacity .3s}.sitem.done .sname{text-decoration:line-through;opacity:.45}
.sx{border:0;background:none;color:var(--mute);font-size:18px}
.clr{display:block;margin:14px auto 0;border:0;background:none;color:var(--mute);font:inherit;text-decoration:underline}
#tedit{margin-top:12px}#tedit label{display:block;margin-top:10px;font-size:14px;color:var(--mute)}
#tedit input{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px}
.views{position:fixed;inset-inline:0;bottom:0;z-index:4;margin:0;border-radius:24px 24px 0 0;border-width:1px 0 0;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible;background:var(--card);box-shadow:0 -8px 28px rgba(0,0,0,.10)}
.vbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;background:transparent;font-size:11px;position:relative;transform:none;box-shadow:none}
.vbtn[aria-pressed=true]{background:transparent;color:var(--acc);transform:none;box-shadow:none;font-weight:700}
.vic{font-size:22px;line-height:1.1;transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.vbtn[aria-pressed=true] .vic{transform:translateY(-4px) scale(1.22)}
.vbtn[aria-pressed=true]::before{content:'';position:absolute;top:-6px;width:30px;height:4px;border-radius:0 0 5px 5px;background:var(--acc);animation:vin .35s}
main{padding-bottom:220px}
.dock{bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:8px}
#toast{bottom:150px}
#tedit{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-10px);margin-top:0;transition:grid-template-rows .5s cubic-bezier(.2,.9,.3,1),opacity .35s,transform .5s cubic-bezier(.2,.9,.3,1),margin .5s}
#tedit.open{grid-template-rows:1fr;opacity:1;transform:none;margin-top:16px}
#tedit .inner{overflow:hidden;min-height:0;padding:0 2px}
#tedit.open label{animation:cin .5s cubic-bezier(.2,.9,.3,1) backwards}
#tedit.open label:nth-child(2){animation-delay:.08s}#tedit.open label:nth-child(3){animation-delay:.16s}
#tedit.open .save{animation:cin .5s .24s cubic-bezier(.2,.9,.3,1) backwards}
.row button{transition:background .3s,color .3s,border-color .3s,transform .15s}.row button:active{transform:scale(.94)}
.row button.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc);font-weight:700}
#intro{position:fixed;inset:0;z-index:20;background:#05060f;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#eef0ff;overflow:hidden;transition:opacity .9s ease,transform .9s cubic-bezier(.6,0,.3,1),filter .9s}
#intro.out{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
#intro svg{position:absolute;inset:0;width:100%;height:100%}
.it-txt{position:relative;text-align:center;padding:0 24px calc(56px + env(safe-area-inset-bottom,0px))}
.it-txt h2{font-size:42px;margin:0 0 6px;font-weight:700;animation:iin 1.4s .3s backwards cubic-bezier(.2,.9,.3,1)}
.it-txt p{margin:0 0 26px;color:#aab0e0;font-size:16px;animation:iin 1.4s .6s backwards cubic-bezier(.2,.9,.3,1)}
.it-btn{border:1px solid #ffffff33;background:#ffffff14;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:inherit;font-size:17px;padding:14px 48px;border-radius:99px;animation:iin 1.4s .9s backwards cubic-bezier(.2,.9,.3,1);transition:transform .2s,background .3s}
.it-btn:active{transform:scale(.94);background:#ffffff26}
@keyframes iin{from{opacity:0;transform:translateY(26px)}}
.icl{animation:idrift 70s linear infinite}.i2{animation-duration:95s;animation-delay:-40s}.i3{animation-duration:120s;animation-delay:-80s}
@keyframes idrift{from{transform:translateX(-140px)}to{transform:translateX(420px)}}
.ff{animation:ffl 6s ease-in-out infinite}
@keyframes ffl{0%,100%{transform:translate(0,0);opacity:0}30%{opacity:1}50%{transform:translate(14px,-22px);opacity:.9}80%{opacity:.2}}
.win{animation:tw 4s ease-in-out infinite}
.shoot{opacity:0;animation:shoot 8s 2.5s infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(-170px,95px);opacity:0}100%{opacity:0}}
body{background:#02030a}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
.it-txt{display:none}
main{position:relative}
#bgmoon{transition:transform 1.5s cubic-bezier(.6,0,.2,1),opacity 1.2s ease}
body.nomoon #bgmoon{transform:translate(150px,-210px);opacity:0}
#modes{display:none}
.card,.fstats div,.addrow input,.hd button,.inav button,.pm,.views{background:color-mix(in srgb,var(--card) 60%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.views{background:color-mix(in srgb,var(--card) 80%,transparent)}
.side{background:color-mix(in srgb,var(--card) 60%,transparent)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.nomoon #bgmoon{transform:translate(70px,-110px);opacity:0}
.shg{opacity:0;animation:shoot2 16s 3s infinite}.s2{animation-duration:23s;animation-delay:9s}.s3{animation-duration:29s;animation-delay:17s}
@keyframes shoot2{0%{opacity:0;transform:translate(0,0)}1.5%{opacity:1}10%{transform:translate(-150px,85px);opacity:0}100%{opacity:0}}
.spk{animation:spk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes spk{50%{transform:scale(1.7);opacity:.35}}
.mw{animation:mwp 12s ease-in-out infinite}@keyframes mwp{50%{opacity:.55}}
.i4{animation-duration:80s;animation-delay:-20s}.i5{animation-duration:140s;animation-delay:-60s}
.smk{animation:smk 6s ease-out infinite}@keyframes smk{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.35}100%{transform:translate(12px,-42px) scale(1.9);opacity:0}}
:root[data-theme='dark']{--ink:#ffffff;--mute:#cdd2f4}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(2,3,12,.1),rgba(2,3,12,.4))}
main{text-shadow:0 1px 8px rgba(0,0,0,.55)}
.card,.fstats div,.addrow input,.hd button,.inav button,.pm{background:color-mix(in srgb,var(--card) 76%,transparent)}
.views{background:color-mix(in srgb,var(--card) 88%,transparent)}
.side{background:color-mix(in srgb,var(--card) 76%,transparent)!important}
.tab:not([aria-pressed=true]),.chip:not([aria-pressed=true]){background:color-mix(in srgb,var(--card) 72%,transparent)}
.dock{bottom:calc(98px + env(safe-area-inset-bottom,0px));background:none;padding-bottom:6px}
#toast{bottom:190px}
h1{font-size:31px}
.txt{font-size:18px}.top{font-size:13px}.tab,.chip{font-size:15.5px}.acts{font-size:15.5px}
.sname{font-size:18px}.hname{font-size:19px}.streak{font-size:15px}.day small{font-size:12px}
.fsub,.tinfo{font-size:15px}.tl{font-size:17px}.tt{font-size:15px}.fstats div{font-size:13px}

<body>
<main>
  <div class='hd'><h1>مساحتي</h1></div>
  <div class="views" id="views"></div>
  <section id="notesView">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </section>
  <section id="habits" hidden></section>
  <section id='forest' hidden></section>
  <section id='shop' hidden></section>
  <section id='tasbih' hidden></section>  <div id='toast' role='status'></div>
  <div id='bg' aria-hidden='true'></div>
</main>
<div class="dock">
  <button class="side" id="qVoice" aria-label="تسجيل صوت">🎤</button>
  <button class="main" id="qText" aria-label="إضافة جديد">＋</button>
  <button class="side" id="qImg" aria-label="إضافة صورة">📷</button>
</div>
<div class="sheet" id="sheet"><div class="pane">
  <div class="chips" id="types"></div>
  <textarea id="text" placeholder="اكتب هنا..."></textarea>
  <input type="datetime-local" id="due" hidden aria-label="الموعد">
  <div class="row">
    <button id="recBtn">🎤 تسجيل صوت</button>
    <button id="imgBtn">📷 صورة</button>
  </div>
  <div class="pv" id="pv"></div>
  <button class="save" id="save">حفظ</button>
  <button class="save" id="cancel" style="background:transparent;color:var(--mute);margin-top:4px">إلغاء</button>
</div></div>
<script>
const TYPES={note:'ملاحظة',task:'مهمة',event:'موعد'};
let items=[],filter='all',curType='note',audioBlob=null,imgBlob=null,rec=null,chunks=[],mem=false,db=null;

function openDB(){return new Promise(r=>{try{const q=indexedDB.open('masaha',1);q.onupgradeneeded=()=>q.result.createObjectStore('items',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}})}
function put(it){if(!db)return;try{const tx=db.transaction('items','readwrite');tx.objectStore('items').put(it);tx.onerror=tx.onabort=()=>toast('مقدرتش أحفظ. ممكن مساحة التخزين مليانة.')}catch(e){toast('مقدرتش أحفظ.')}}
function del(id){if(!db)return;try{db.transaction('items','readwrite').objectStore('items').delete(id)}catch(e){}}
function loadAll(){return new Promise(r=>{if(!db)return r([]);try{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])}catch(e){r([])}})}

const $=id=>document.getElementById(id);
const _u=new WeakMap();function blobURL(b){let u=_u.get(b);if(!u){u=URL.createObjectURL(b);_u.set(b,u)}return u}
let _et=0;function _err(){const n=Date.now();if(n-_et>8000){_et=n;try{toast('حصل خطأ بسيط. لو استمر اقفل التطبيق وافتحه تاني.')}catch(e){}}}
addEventListener('error',_err);addEventListener('unhandledrejection',_err);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function renderTabs(){const t=$('tabs');t.innerHTML='';[['all','الكل'],['note','ملاحظات'],['task','مهام'],['event','مواعيد']].forEach(([k,l])=>{const b=el('button','tab',l);b.setAttribute('aria-pressed',filter===k);b.onclick=()=>{filter=k;render(true)};t.appendChild(b)})}
function fmt(d){return new Date(d).toLocaleString('ar-EG',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function render(anim){
  renderTabs();const L=$('list');L.innerHTML='';L.dataset.anim=anim?1:0;
  const v=items.filter(i=>filter==='all'||i.type===filter).sort((a,b)=>(a.done-b.done)||(b.created-a.created));
  if(!v.length){L.appendChild(el('div','empty','مفيش حاجة هنا لسه.\nاضغط ＋ أو 🎤 أو 📷 وابدأ احفظ أي حاجة.'));return}
  v.forEach(i=>{
    const c=el('div','card'+(i.done?' done':''));c.style.setProperty('--i',L.children.length);
    const top=el('div','top');top.appendChild(el('span','badge',TYPES[i.type]));
    if(i.due){const late=!i.done&&new Date(i.due)<new Date();top.appendChild(el('span','due'+(late?' late':''),(late?'فات: ':'')+fmt(i.due)))}
    c.appendChild(top);
    if(i.text)c.appendChild(el('p','txt',i.text));
    if(i.img){const im=document.createElement('img');im.src=blobURL(i.img);im.loading='lazy';im.decoding='async';im.alt='صورة';c.appendChild(im)}
    if(i.audio){const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=blobURL(i.audio);c.appendChild(a)}
    const ac=el('div','acts');
    if(i.type==='task'||i.type==='event'){const b=el('button','chk',i.done?'↩ رجّعها':'✓ خلصت');b.onclick=()=>{i.done=!i.done;put(i);render()};ac.appendChild(b)}
    const d=el('button',null,'حذف');d.onclick=()=>{if(sure(d)){items=items.filter(x=>x.id!==i.id);del(i.id);render()}};ac.appendChild(d);
    c.appendChild(ac);L.appendChild(c)});
}
function setType(t){curType=t;[...$('types').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));$('due').hidden=t==='note'}
function preview(){const p=$('pv');p.innerHTML='';
  if(imgBlob){const im=document.createElement('img');im.src=blobURL(imgBlob);p.appendChild(im)}
  if(audioBlob){const a=document.createElement('audio');a.controls=true;a.src=blobURL(audioBlob);a.style.width='100%';p.appendChild(a)}}
function openSheet(t){setType(t||'note');$('sheet').classList.add('on');if(!t||t==='note')$('text').focus()}
function closeSheet(){$('sheet').classList.remove('on');$('text').value='';$('due').value='';audioBlob=imgBlob=null;stopRec(true);$('pv').innerHTML=''}

async function toggleRec(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());if(chunks.length){audioBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});preview()}$('recBtn').textContent='🎤 تسجيل صوت';$('recBtn').classList.remove('rec')};
    rec.start();$('recBtn').textContent='⏹ إيقاف التسجيل';$('recBtn').classList.add('rec');
  }catch(e){toast('مقدرتش أفتح المايك. اسمح للمتصفح باستخدام المايك وجرب تاني.')}
}
function stopRec(silent){if(rec&&rec.state==='recording'){if(silent)rec.onstop=null;rec.stop()}}
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>r(b||f),'image/jpeg',.82)};im.onerror=()=>r(f);im.src=blobURL(f)})}

$('types').append(...Object.entries(TYPES).map(([k,l])=>{const b=el('button','chip',({note:'📝 ',task:'✅ ',event:'⏰ '})[k]+l);b.dataset.t=k;b.onclick=()=>setType(k);return b}));
$('qText').onclick=()=>openSheet('note');
$('qVoice').onclick=()=>{openSheet('note');toggleRec()};
$('recBtn').onclick=toggleRec;
$('cancel').onclick=closeSheet;
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('save').onclick=()=>{
  if($('sheet').classList.contains('closing'))return;
  const text=$('text').value.trim();
  if(!text&&!audioBlob&&!imgBlob){toast('اكتب حاجة أو سجّل صوت أو ضيف صورة الأول.');return}
  const it={id:Date.now()+''+Math.floor(Math.random()*1000),type:curType,text,due:curType==='note'?'':$('due').value,done:false,created:Date.now(),audio:audioBlob,img:imgBlob};
  items.push(it);put(it);closeSheet();render(true);toast('اتحفظت ✓');
};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let view='notes';
const VIEWS=[];
VIEWS.push(['notes','🗂️ مساحتي'],['forest','🌳 الغابة'],['habits','📋 العادات'],['shop','🛒 المشتريات'],['tasbih','🕌 دين']);
function renderViews(){const v=$('views');v.innerHTML='';VIEWS.forEach(([k,l])=>{const b=el('button','vbtn');const sp=l.indexOf(' ');b.append(el('span','vic',l.slice(0,sp)),el('span','vlb',l.slice(sp+1)));b.setAttribute('aria-pressed',view===k);b.onclick=()=>setView(k);v.appendChild(b)})}
function setView(k){const pi=VIEWS.findIndex(v=>v[0]===view),ni=VIEWS.findIndex(v=>v[0]===k);document.documentElement.style.setProperty('--dx',(ni>pi?-36:36)+'px');view=k;ls.set('view',k);renderViews();
  ['notesView','forest','habits','shop','tasbih'].forEach(s=>{$(s).hidden=s!==(k==='notes'?'notesView':k)});
  document.querySelector('.dock').style.display=k==='notes'?'flex':'none';
  document.body.classList.toggle('nomoon',k!=='notes');if(k==='habits')renderHabits(true);if(k==='tasbih')renderTasbih();if(k==='forest')paintForest();if(k==='shop')renderShop(true);
  const s=$(k==='notes'?'notesView':k);s.classList.remove('enter');void s.offsetWidth;s.classList.add('enter')}

let habits=ls.get('habits',[]),lastTap='';
if(!Array.isArray(habits))habits=[];habits=habits.filter(h=>h&&h.id&&h.days&&typeof h.days==='object');
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
function daysBack(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a}
function streak(h){let s=0;const d=new Date();if(!h.days[dk(d)])d.setDate(d.getDate()-1);while(h.days[dk(d)]){s++;d.setDate(d.getDate()-1)}return s}
function renderHabits(anim){
  const H=$('habits');H.innerHTML='';H.dataset.anim=anim?1:0;
  const f=el('div','addrow');const inp=document.createElement('input');inp.placeholder='عادة جديدة، مثلاً: أذاكر ساعة';inp.maxLength=40;
  const add=()=>{const n=inp.value.trim();if(!n)return;habits.push({id:Date.now()+'',name:n,days:{}});ls.set('habits',habits);renderHabits(true)};
  const ab=el('button',null,'إضافة');ab.onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};f.append(inp,ab);H.appendChild(f);
  if(!habits.length){H.appendChild(el('div','empty','ضيف أول عادة وعلّم عليها كل يوم.\nالسلسلة بتكبر كل يوم بتلتزم فيه 🔥'));return}
  habits.forEach((h,n)=>{
    const c=el('div','card hcard');c.style.setProperty('--i',n);
    const top=el('div','htop');top.appendChild(el('span','hname',h.name));
