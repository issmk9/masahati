<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#02030a">
<meta name="description" content="مساحتي: مساحة شخصية للملاحظات والمهام والتركيز والذكر">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساحتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#1b2036;--mute:#6b7190;--acc:#4b3fe0;--accSoft:#e4e1fd;--ok:#14a37f;--warn:#d9480f;--line:#dcdff0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11142a;--card:#1b2040;--ink:#eef0ff;--mute:#9aa0c8;--acc:#8b82ff;--accSoft:#2b2d63;--line:#2d3260;--warn:#ff8a5c}}
:root[data-theme="dark"]{--bg:#11142a;--card:#1b2040;--ink:#eef0ff;--mute:#9aa0c8;--acc:#8b82ff;--accSoft:#2b2d63;--line:#2d3260;--warn:#ff8a5c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 150px}
h1{font-size:28px;margin:8px 0 14px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.due{margin-inline-start:auto}
.due.late{color:var(--warn);font-weight:700}
.txt{margin:10px 0 0;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.done .txt{text-decoration:line-through;opacity:.5}
audio{width:100%;margin-top:10px;height:40px}
.empty{text-align:center;color:var(--mute);margin-top:60px;line-height:1.9}
.dock{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;align-items:center;background:linear-gradient(transparent,var(--bg) 40%)}
.dock button{border:0;font:inherit;color:#fff;background:var(--acc);box-shadow:0 8px 24px rgba(75,63,224,.35)}
.main{width:72px;height:72px;border-radius:50%;font-size:34px}
.side{width:54px;height:54px;border-radius:50%;font-size:22px;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.chips{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px}
.chip[aria-pressed=true]{background:var(--accSoft);border-color:var(--acc);color:var(--acc);font-weight:700}
textarea,input[type=datetime-local]{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit}
.row .rec{background:#e03131;border-color:#e03131;color:#fff}
.save{width:100%;margin-top:14px;border:0;background:var(--acc);color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px}
.pv img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.views{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:99px;margin-bottom:14px}
.vbtn{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;padding:10px 4px;border-radius:99px;transition:background .35s cubic-bezier(.3,1.4,.5,1),color .25s,transform .25s}
.vbtn[aria-pressed=true]{background:var(--acc);color:#fff;transform:scale(1.05);box-shadow:0 6px 16px rgba(75,63,224,.35)}
.enter{animation:vin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.main{position:relative;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.main:active{transform:scale(.86) rotate(90deg)}
.main::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:ringp 2.4s ease-out infinite;pointer-events:none}
@keyframes ringp{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.side{transition:transform .2s}
.side:active{transform:scale(.84)}
@keyframes pop{from{transform:scale(0) rotate(-45deg)}to{transform:none}}
.tchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tchips .chip{flex:none}
.tbox{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:22px auto 10px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:10}
.arc{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s cubic-bezier(.3,1.2,.5,1),stroke .3s}
.tbox.full .arc{stroke:var(--ok)}
.tap{position:absolute;inset:9%;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 14px 34px rgba(75,63,224,.25),inset 0 0 0 1px var(--line);transition:transform .15s cubic-bezier(.3,1.5,.5,1);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.tap:active{transform:scale(.92)}
.tl{font-size:16px;color:var(--mute);text-align:center;padding:0 12px}
.tc{font-size:64px;font-weight:700;line-height:1.1;color:var(--acc)}
.tt{font-size:14px;color:var(--mute)}
.tc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}
.rip{position:absolute;inset:0;border-radius:50%;background:var(--acc);opacity:.28;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(0)}to{transform:scale(1);opacity:0}}
.tbox.cele{animation:cele .8s}
@keyframes cele{30%{transform:scale(1.08)}60%{transform:scale(.97)}}
.tinfo{text-align:center;color:var(--mute);font-size:14px;margin-bottom:6px}
.views{overflow-x:auto}
.vbtn{flex:none;padding:10px 14px}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd h1{margin:8px 0 14px}
.hd button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;transition:transform .4s}
.hd button:active{transform:rotate(120deg) scale(.9)}
.scene{border-radius:24px;overflow:hidden;border:1px solid var(--line);margin-top:8px;box-shadow:0 12px 30px rgba(0,0,0,.14);animation:vin .6s}
.scene svg{display:block;width:100%}
.cloud{animation:drift 60s linear infinite}
.c2{animation-duration:85s;animation-delay:-30s}
.c3{animation-duration:110s;animation-delay:-70s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(450px)}}
.star,.shim{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.glow{animation:gl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gl{50%{transform:scale(1.25);opacity:.4}}
#liveArt{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s linear}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
.pop{animation:popin .9s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{from{transform:scale(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.inav button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px}
.inav button:disabled{opacity:.3}
.inav b{color:var(--ink);text-align:center;flex:1;font-size:15px}
.clockrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.clock{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;min-width:170px;text-align:center}
.pm{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.pm:disabled{opacity:.25}
.fsub{text-align:center;color:var(--mute);font-size:14px;margin:2px 0 10px}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fstats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mute)}
.fstats b{display:block;font-size:22px;color:var(--acc);margin-bottom:2px}
.chip:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,1.4,.4,1);z-index:9;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tedit{margin-top:12px}
#tedit label{display:block;margin-top:10px;font-size:14px;color:var(--mute)}
#tedit input{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px}
.views{position:fixed;inset-inline:0;bottom:0;z-index:4;margin:0;border-radius:24px 24px 0 0;border-width:1px 0 0;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible;background:var(--card);box-shadow:0 -8px 28px rgba(0,0,0,.10)}
.vbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;background:transparent;font-size:11px;position:relative;transform:none;box-shadow:none}
.vbtn[aria-pressed=true]{background:transparent;color:var(--acc);transform:none;box-shadow:none;font-weight:700}
.vic{font-size:22px;line-height:1.1;transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.vbtn[aria-pressed=true] .vic{transform:translateY(-4px) scale(1.22)}
.vbtn[aria-pressed=true]::before{content:'';position:absolute;top:-6px;width:30px;height:4px;border-radius:0 0 5px 5px;background:var(--acc);animation:vin .35s}
main{padding-bottom:220px}
.dock{bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:8px}
#toast{bottom:150px}
#tedit{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-10px);margin-top:0;transition:grid-template-rows .5s cubic-bezier(.2,.9,.3,1),opacity .35s,transform .5s cubic-bezier(.2,.9,.3,1),margin .5s}
#tedit.open{grid-template-rows:1fr;opacity:1;transform:none;margin-top:16px}
#tedit .inner{overflow:hidden;min-height:0;padding:0 2px}
#tedit.open label{animation:cin .5s cubic-bezier(.2,.9,.3,1) backwards}
#tedit.open label:nth-child(2){animation-delay:.08s}
#tedit.open label:nth-child(3){animation-delay:.16s}
#tedit.open .save{animation:cin .5s .24s cubic-bezier(.2,.9,.3,1) backwards}
.row button{transition:background .3s,color .3s,border-color .3s,transform .15s}
.row button:active{transform:scale(.94)}
.row button.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc);font-weight:700}
.win{animation:tw 4s ease-in-out infinite}
body{background:#02030a}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
main{position:relative}
.fstats div,.hd button,.inav button,.pm,.views{background:color-mix(in srgb,var(--card) 60%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.views{background:color-mix(in srgb,var(--card) 80%,transparent)}
.side{background:color-mix(in srgb,var(--card) 60%,transparent)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* التعديل المخصص لحركة وطريق الشهب الجذبي المنحني */
.shg{opacity:0;animation:shootArc 16s 3s infinite;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.25,1,.5,1)}
.s2{animation-duration:23s;animation-delay:9s}
.s3{animation-duration:29s;animation-delay:17s}
@keyframes shootArc{
  0% { opacity: 0; transform: translate(0, 0) rotate(-25deg) scale(0.6); }
  2% { opacity: 1; }
  25% { opacity: 1; transform: translate(-50px, -40px) rotate(-15deg) scale(1); }
  60% { opacity: 0.95; transform: translate(-130px, 60px) rotate(20deg) scale(1.1); }
  85% { opacity: 0.4; transform: translate(-200px, 160px) rotate(45deg) scale(0.9); }
  100% { opacity: 0; transform: translate(-220px, 190px) rotate(50deg) scale(0.5); }
}

.aur{animation:aur 26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.aur2{animation-duration:34s;animation-delay:-12s}
.aur3{animation-duration:21s;animation-delay:-6s}
@keyframes aur{0%{transform:translate(0,0) scaleY(1);opacity:.5}50%{opacity:.8}100%{transform:translate(14px,10px) scaleY(1.12);opacity:.55}}
.mspk{animation:tw 2.4s ease-in-out infinite}
.spk{animation:spk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spk{50%{transform:scale(1.7);opacity:.35}}
@keyframes mwp{50%{opacity:.55}}
.smk{animation:smk 6s ease-out infinite}
@keyframes smk{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.35}100%{transform:translate(12px,-42px) scale(1.9);opacity:0}}
